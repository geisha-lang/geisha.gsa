name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for artifacts (and GitHub Release tag if publishing)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-24.04
            cross_x64: "0"
          - label: linux-arm64
            os: ubuntu-24.04-arm
            cross_x64: "0"
          - label: darwin-arm64-and-x86_64
            os: macos-15
            cross_x64: "1"
          - label: windows-x86_64
            os: windows-latest
            cross_x64: "0"

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LLVM/Clang & Wasm32 toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft*.list /etc/apt/sources.list.d/azure*.list
          sudo apt-get update
          sudo apt-get install -y clang lld xz-utils

      - name: Install LLVM/Wasm32 toolchain (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew list llvm >/dev/null 2>&1 || brew install llvm
          brew list lld >/dev/null 2>&1 || brew install lld
          command -v xz >/dev/null 2>&1 || brew install xz

      - name: Set up LLVM/Clang & GNU Make (Windows)
        if: runner.os == 'Windows'
        run: |
          if [ -d "/c/Program Files/LLVM/bin" ]; then
            echo "/c/Program Files/LLVM/bin" >> "$GITHUB_PATH"
            export PATH="/c/Program Files/LLVM/bin:$PATH"
          fi
          if ! command -v make >/dev/null 2>&1; then
            choco install -y make --no-progress
            echo "/c/ProgramData/chocolatey/bin" >> "$GITHUB_PATH"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Determine release version
        id: meta
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
          else
            VER="dev-${GITHUB_SHA::7}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: 3-stage bootstrap, test & package release archives
        env:
          PACKAGE_DARWIN_X86_64: ${{ matrix.cross_x64 }}
        run: |
          make runtime wasm-runtime bootstrap
          make test
          make dist VERSION="${{ steps.meta.outputs.version }}"
          ls -lh dist/

      - name: Upload release archives
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-24.04
    steps:
      - name: Download all platform release archives
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Assemble SHA256SUMS.txt
        run: |
          cd artifacts
          cat *.sha256 | sort -k2 > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          ls -lh

      - name: Upload combined release bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: geisha-release-bundle
          path: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS.txt

      - name: Publish GitHub Release (on v* tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
